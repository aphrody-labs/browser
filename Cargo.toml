# One Cargo workspace for everything cargo builds here: the imported crates (third_party/<upstream>/<crate>) and the first-party
# ones (components/<crate>). tools/flatten.py keeps `members` and `[patch.crates-io]` in step with tools/upstreams.lock.json.
# The Bun runtime (third_party/bun, a submodule of the aphrody-labs fork) is a workspace of its own with its own build
# (`bun bd`): a crate of ours that needs one of its crates depends on it by path and stays a non-member. The Chromium
# checkout is a build input (build/engines), not a member.
