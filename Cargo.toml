[workspace.package]
version = "0.0.0"
edition = "2024"

# Tools and libraries (hyperfine, the CLIs): abort on panic, one codegen unit.
[profile.release]
lto = "off"
codegen-units = 1
debug = "line-tables-only"
strip = "none"
panic = "abort"

# The browser binary: Servo and Obscura contain a panic to the page or thread that raised it, so it unwinds.
[profile.browser]
inherits = "release"
panic = "unwind"

[profile.dev]
incremental = true
codegen-units = 16
debug = "limited"
panic = "abort"
# Debuginfo goes into .dwo files next to each object instead of into the rlibs: less disk, full information for gdb/lldb.
split-debuginfo = "unpacked"

