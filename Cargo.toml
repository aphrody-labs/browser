# Loops over every byte of an image: unoptimized, a debug build takes seconds per megapixel. Assertions and overflow
# checks stay on. scripts/build/flags.ts does the same for highway_png.cpp.
[profile.dev.package.bun_png]
opt-level = 3

# Runs for every line of a response head and every chunk of a body.
[profile.dev.package.bun_http1]
opt-level = 3

# It stands in for vector code that every test program runs over each byte it parses.
[profile.dev.package.bun_sema_standalone]
opt-level = 3

[profile.release.package.bun_react_compiler]
opt-level = "s"

# The runners behind `--run-typescript-tests`, `--run-prettier-tests` and `--run-eslint-tests`. Only canary and debug
# builds have them, and the time goes into what they test, which keeps its own level.
[profile.release.package.bun_sema_baselines]
opt-level = "z"

[profile.release.package.bun_format_conformance]
opt-level = "z"

[profile.release.package.bun_lint_conformance]
opt-level = "z"

