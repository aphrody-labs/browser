[package]
name = "browser-process"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Child processes that never open a console window (Windows); a plain std::process::Command elsewhere. Legacy published name: browser_process."

[package.metadata.browser]
native = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
