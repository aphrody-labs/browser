[package]
name = "mozjs"
description = "Rust bindings to the Mozilla SpiderMonkey JavaScript engine."
version = "0.27.1"
authors = ["The Servo Project Developers"]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/servo/mozjs/"

[lib]
doctest = false

[features]
default = ["jit", "libz-sys", "intl"]
debugmozjs = ["mozjs_sys/debugmozjs"]
profilemozjs = ["mozjs_sys/profilemozjs"]
jit = ['mozjs_sys/jit']
jitspew = ["mozjs_sys/jitspew"]
libz-sys = ["mozjs_sys/libz-sys"]
libz-rs = ["mozjs_sys/libz-rs"]
intl = ["mozjs_sys/intl"]
crown = ["mozjs_sys/crown"]


[dependencies]
encoding_rs = "0.8.35"
log = "0.4"
# When doing non-version changes also update ../mozjs-sys/etc/sm-security-bump.py
mozjs_sys = {version = "=153.7.0-1", path = "../mozjs_sys"}
num-traits = "0.2"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
criterion = {version = "0.8.2", default-features = false, features = ["html_reports"]}

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8.2"

[build-dependencies]
cc = "1.3"
bindgen = {version = "0.73", default-features = false, features = ["runtime"]}


[[bench]]
name = "latin1_string_conversion"
harness = false
