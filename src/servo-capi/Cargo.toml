[package]
name = "servo-capi"
description = "C API for the Servo rendering engine"
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
rust-version = "1.88.0"
publish = true

[lib]
name = "servo_capi"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
capi = [] # Needed by `cargo-c`.
# TODO: Need to think about which features from servo can be
# exposed here for conditional compilation of C API.

[dependencies]
dpi = "0.1"
euclid = {path = "../euclid"}
libc = "0.2"
log = "0.4.32"
# TODO: We need 'baked-in-resources' as the `inventory` based `ResourceReader`
# doesn't work when libservo is a cdylib.
servo = {version = "=0.8.0", path = "../servo", default-features = false, features = ["js_jit", "baked-in-resources", "bundled_freetype"]}
url = {path = "../rust-url-url"}

# TODO: ANGLE is needed on Windows to provide libEGL.dll and libGLESv2.dll
# for surfman's EGL backend. WGL doesn't work at least on CI.
# This should be eventually be exposed as a feature of this crate.
[target.'cfg(target_os = "windows")'.dependencies]
servo = {version = "=0.8.0", path = "../servo", default-features = false, features = ["no-wgl"]}

[package.metadata.capi.header]
subdirectory = "servo"

[package.metadata.capi.library]
name = "servo_capi"
