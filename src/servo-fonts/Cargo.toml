[package]
name = "servo-fonts"
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
rust-version = "1.88.0"
publish = true

[lib]
name = "fonts"
path = "lib.rs"
test = true
doctest = false

[features]
# Compile FreeType from source (freetype-sys/bundled) instead of searching
# via pkg-config. If this feature is disabled, and pkg-config fails to find a
# suitable freetype version, the build will fail!
# Only affects targets where freetype-sys is a dependency (Linux/Android/OHOS)
bundled_freetype = ["freetype-sys/bundled"]
tracing = ["dep:tracing"]

[dependencies]
app_units = {path = "../app_units"}
atomic_refcell = "0.1.14"
bitflags = "2.11"
content-security-policy = {version = "0.9", features = ["serde"]}
euclid = {path = "../euclid"}
font-types = "0.12"
fonts_traits = {package = "servo-fonts-traits", version = "=0.8.0", path = "../servo-fonts-traits"}
fontsan = {default-features = false, features = ["libz-sys", "wuff"], path = "../fontsan"}
# FIXME (#34517): macOS only needs this when building servo without `--features media-gstreamer`
harfbuzz-sys = {default-features = false, features = ["bundled"], path = "../harfbuzz-sys"}
icu_locale_core = "2.1.0"
icu_properties = {version = "2.1.0", features = ["compiled_data"]}
itertools = "0.15"
libc = "0.2"
log = "0.4.32"
malloc_size_of = {package = "servo-malloc-size-of", version = "=0.8.0", path = "../servo-malloc-size-of"}
malloc_size_of_derive = "0.1"
memmap2 = "0.9.10"
net_traits = {package = "servo-net-traits", version = "=0.8.0", path = "../servo-net-traits"}
num-traits = "0.2"
ohos-deviceinfo = "0.1.0"
paint_api = {package = "servo-paint-api", version = "=0.8.0", path = "../servo-paint-api"}
parking_lot = {version = "0.12", features = ["serde"]}
postcard = {version = "1.1.3", default-features = false, features = ["use-std"]}
profile_traits = {package = "servo-profile-traits", version = "=0.8.0", path = "../servo-profile-traits"}
read-fonts = "0.46"
rustc-hash = "2.1.2"
serde = "1.0.228"
servo-base = {version = "=0.8.0", path = "../servo-base"}
servo-config = {version = "=0.8.0", path = "../servo-config"}
servo-tracing = {version = "=0.8.0", path = "../servo-tracing"}
servo-url = {version = "=0.8.0", path = "../servo-url"}
servo_arc = {path = "../servo_arc"}
skrifa = "0.49.0"
smallvec = {version = "1.15", features = ["serde", "union"]}
stylo = {path = "../stylo"}
stylo_atoms = {path = "../stylo_atoms"}
tracing = {version = "0.1.44", optional = true}
unicode-properties = {version = "0.1.4", features = ["emoji"]}
unicode-script = "0.5"
url = {path = "../rust-url-url"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}
webrender_api = {path = "../webrender_api"}

[target.'cfg(target_os = "macos")'.dependencies]
byteorder = "1.5"
harfbuzz-sys = {default-features = false, features = ["coretext"], path = "../harfbuzz-sys"}
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"

[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "freebsd"))'.dependencies]
freetype-sys = "0.23"
harfbuzz-sys = {default-features = false, features = ["freetype"], path = "../harfbuzz-sys"}
servo-allocator = {version = "=0.8.0", path = "../servo-allocator"}

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
fontconfig_sys = {package = "yeslogic-fontconfig-sys", version = "6"}

[target.'cfg(target_os = "android")'.dependencies]
xml = "1.1"

[target.'cfg(any(target_os = "android",target_env = "ohos"))'.dependencies]
# Always bundle freetype on android and openharmony
freetype-sys = {version = "0.23", features = ["bundled"]}

[target.'cfg(target_os = "windows")'.dependencies]
dwrote = {path = "../dwrote"}
harfbuzz-sys = {default-features = false, features = ["directwrite"], path = "../harfbuzz-sys"}
winapi = "0.3"

[lints.clippy]
manual_string_new = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)', 'cfg(coverage)', 'cfg(llvm_pgo)', 'cfg(ohos_mock)'] }

# RSA key generation could be very slow without compilation
# optimizations, in development mode. Without optimizations, WPT might
# consider RSA key generation tests fail due to timeout.
# Building with higher optimization levels can speed up the key
# generation process to avoid false negative result in those tests.
# More details: <https://docs.rs/rsa/0.10.0-rc.18/rsa/index.html>
