[package]
name = "servo-media-gstreamer"
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
rust-version = "1.88.0"
publish = true

[lib]
name = "servo_media_gstreamer"
path = "lib.rs"

[features]
glx = ["servo-media-gstreamer-render-unix/gl-x11"]
wayland = ["servo-media-gstreamer-render-unix/gl-wayland"]
v1_28 = ["gstreamer/v1_28"]

[dependencies]
byte-slice-cast = "1.2.3"
data-url = {path = "../data-url"}
glib = "0.22"
glib-sys = "0.22"
gstreamer = {version = "0.25", features = ["v1_18"]}
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-base = "0.25"
gstreamer-play = "0.25"
gstreamer-sdp = "0.25"
gstreamer-sys = "0.25"
gstreamer-video = "0.25"
gstreamer-webrtc = {version = "0.25", features = ["v1_18"]}
log = "0.4.32"
servo-base = {version = "=0.8.0", path = "../servo-base"}
servo-media = {version = "=0.8.0", path = "../servo-media"}
servo-media-audio = {version = "=0.8.0", path = "../servo-media-audio"}
servo-media-gstreamer-render = {version = "=0.8.0", path = "../servo-media-gstreamer-render"}
servo-media-player = {version = "=0.8.0", path = "../servo-media-player"}
servo-media-streams = {version = "=0.8.0", path = "../servo-media-streams"}
servo-media-traits = {version = "=0.8.0", path = "../servo-media-traits"}
servo-media-webrtc = {version = "=0.8.0", path = "../servo-media-webrtc"}
url = {path = "../rust-url-url"}

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
servo-media-gstreamer-render-unix = {version = "=0.8.0", path = "../servo-media-gstreamer-render-unix", features = ["gl-egl"]}

[target.'cfg(target_os = "android")'.dependencies]
servo-media-gstreamer-render-android = {version = "=0.8.0", path = "../servo-media-gstreamer-render-android"}

[lints.clippy]
manual_string_new = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)', 'cfg(coverage)', 'cfg(llvm_pgo)', 'cfg(ohos_mock)'] }

# RSA key generation could be very slow without compilation
# optimizations, in development mode. Without optimizations, WPT might
# consider RSA key generation tests fail due to timeout.
# Building with higher optimization levels can speed up the key
# generation process to avoid false negative result in those tests.
# More details: <https://docs.rs/rsa/0.10.0-rc.18/rsa/index.html>
