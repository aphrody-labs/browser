[package]
name = "servo-script-webcrypto"
build = "build.rs"
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
rust-version = "1.88.0"
publish = true

[lib]
name = "script_webcrypto"
path = "lib.rs"

[features]
subtlecrypto = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:aes-kw",
    "dep:argon2",
    "dep:aws-lc-rs",
    "dep:base64ct",
    "dep:cbc",
    "dep:chacha20poly1305",
    "dep:crypto-bigint",
    "dep:cshake",
    "dep:ctr",
    "dep:ctutils",
    "dep:ecdsa",
    "dep:ed25519-dalek",
    "dep:ed448-goldilocks",
    "dep:elliptic-curve",
    "dep:hkdf",
    "dep:itertools",
    "dep:k12",
    "dep:keccak",
    "dep:ml-dsa",
    "dep:ml-kem",
    "dep:ocb3",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:pbkdf2",
    "dep:pkcs8",
    "dep:rsa",
    "dep:rustc-hash",
    "dep:serde_core",
    "dep:servo-base",
    "dep:servo-constellation-traits",
    "dep:sha1",
    "dep:sha2",
    "dep:sha3",
    "dep:sponge-cursor",
    "dep:strum",
    "dep:x-wing",
    "dep:x25519-dalek",
    "dep:x448",
    "dep:zeroize",
    "script_bindings/subtlecrypto",
    "servo-constellation-traits/subtlecrypto",
]

[dependencies]
aes = {version = "0.9", features = ["zeroize"], optional = true}
aes-gcm = {version = "0.11", features = ["hazmat", "zeroize"], optional = true}
aes-kw = {version = "0.3", features = ["zeroize"], optional = true}
argon2 = {version = "0.6", features = ["alloc"], optional = true}
aws-lc-rs = {version = "1.17", default-features = false, features = ["aws-lc-sys"], optional = true}
base64ct = {version = "1.8", features = ["alloc"], optional = true}
cbc = {version = "0.2", features = ["alloc", "zeroize"], optional = true}
chacha20poly1305 = {version = "0.11", features = ["rand_core", "zeroize"], optional = true}
crypto-bigint = {version = "0.7", optional = true}
cshake = {version = "0.2", optional = true}
ctr = {version = "0.10", features = ["zeroize"], optional = true}
ctutils = {version = "0.4", optional = true}
deny_public_fields = {package = "servo-deny-public-fields", version = "=0.8.0", path = "../servo-deny-public-fields"}
dom_struct = {package = "servo-dom-struct", version = "=0.8.0", path = "../servo-dom-struct"}
ecdsa = {version = "0.17", optional = true}
ed25519-dalek = {version = "3.0", features = ["alloc", "pkcs8", "rand_core", "zeroize"], optional = true}
ed448-goldilocks = {version = "=0.14.0-pre.15", optional = true}
elliptic-curve = {version = "0.14", features = ["pkcs8"], optional = true}
hkdf = {version = "0.13", optional = true}
itertools = {version = "0.15", optional = true}
js = {package = "mozjs", default-features = false, features = ["intl", "libz-sys"], path = "../mozjs"}
jstraceable_derive = {package = "servo-jstraceable-derive", version = "=0.8.0", path = "../servo-jstraceable-derive"}
k12 = {version = "0.5", optional = true}
keccak = {version = "0.2", optional = true}
malloc_size_of = {package = "servo-malloc-size-of", version = "=0.8.0", path = "../servo-malloc-size-of"}
malloc_size_of_derive = "0.1"
ml-dsa = {version = "0.1", features = ["zeroize"], optional = true}
ml-kem = {version = "0.3", features = ["getrandom", "pkcs8", "zeroize"], optional = true}
ocb3 = {version = "0.2", optional = true}
p256 = {version = "0.14", features = ["ecdh"], optional = true}
p384 = {version = "0.14", features = ["ecdh"], optional = true}
p521 = {version = "0.14", features = ["ecdh"], optional = true}
pbkdf2 = {version = "0.13", features = ["hmac"], optional = true}
pkcs8 = {version = "0.11", optional = true}
rand = "0.10"
rsa = {version = "0.10", features = ["pkcs1v15"], optional = true}
rustc-hash = {version = "2.1.2", optional = true}
script_bindings = {package = "servo-script-bindings", version = "=0.8.0", path = "../servo-script-bindings"}
serde_core = {version = "1.0.226", optional = true}
servo-base = {version = "=0.8.0", path = "../servo-base", optional = true}
servo-constellation-traits = {version = "=0.8.0", path = "../servo-constellation-traits", optional = true}
sha1 = {version = "0.11", optional = true}
sha2 = {version = "0.11", optional = true}
sha3 = {version = "0.12", optional = true}
sponge-cursor = {version = "0.1", optional = true}
strum = {version = "0.28", features = ["derive"], optional = true}
trait-set = "0.5"
uuid = {version = "1.23.3", features = ["v4", "v5"]}
x-wing = {version = "0.1.0", features = ["zeroize"], optional = true}
x25519-dalek = {version = "3.0", features = ["getrandom", "static_secrets", "zeroize"], optional = true}
x448 = {version = "=0.14.0-pre.12", features = ["static_secrets"], optional = true}
zeroize = {version = "1.8", optional = true}

[lints.clippy]
manual_string_new = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)', 'cfg(coverage)', 'cfg(llvm_pgo)', 'cfg(ohos_mock)'] }

# RSA key generation could be very slow without compilation
# optimizations, in development mode. Without optimizations, WPT might
# consider RSA key generation tests fail due to timeout.
# Building with higher optimization levels can speed up the key
# generation process to avoid false negative result in those tests.
# More details: <https://docs.rs/rsa/0.10.0-rc.18/rsa/index.html>
