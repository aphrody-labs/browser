[package]
name = "servo"
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
rust-version = "1.88.0"
publish = true

[lib]
name = "servo"
path = "lib.rs"
crate-type = ["rlib"]

[features]
# Note: Servoshell does not use the default features of servo, so you also
# need to add feature-groups that should be default to ports/servoshell/Cargo.toml
default = ["bundled", "clipboard", "default_tooling", "js_jit", "multiprocess"]

## Convenience feature groups, to select multiple related features for a sensible
#  configuration with `--no-default-features` build
#
# A convenience feature to enable all default web features servo has.
default_web_features = ["brotli-compression-stream", "clipboard", "subtlecrypto", "webgpu", "webgl", "webxr"]
default_tooling = ["devtools"]

# Bundle required resources in the binary.
bundled = ["baked-in-resources", "bundled_freetype"]

# Individual features below this line.
background_hang_monitor = ["servo-background-hang-monitor/sampler"]

# Allow brotli to be used for compression and decompression in TransportStream JavaScript API
brotli-compression-stream = ["script/brotli-compression-stream"]

# This is slightly magical, but this will also work on ohos, where `servo-default-resource` is not added,
# which makes `baked-in-resources a no-op (as intended) on ohos (and perhaps other platforms in the future).
baked-in-resources = ["dep:servo-default-resources"]
bluetooth = [
    "servo-bluetooth-traits",
    "dep:servo-bluetooth",
    "servo-constellation/bluetooth",
    "servo-constellation-traits/bluetooth",
    "script/bluetooth",
    "script_traits/bluetooth",
]
bundled_freetype = ["fonts/bundled_freetype"]
clipboard = ["dep:arboard", "dep:ohos-pasteboard"]
crown = ["script/crown"]
debugmozjs = ["script/debugmozjs"]
devtools = [
    "dep:devtools",
    "dep:devtools_traits",
    "net/devtools",
    "script/devtools",
    "servo-constellation/devtools",
]
dynamic_freetype = ["webrender/dynamic_freetype"]
gamepad = [
    "script/gamepad",
    "servo-constellation/gamepad",
    "embedder_traits/gamepad",
]
jitspew = ["script/jitspew"]
js_backtrace = ["script/js_backtrace"]
js_jit = ["script/js_jit"]
# The `dep:` prefixes here mean that these do nothing on Android and OHOS, where these
# dependencies aren't declared.
media-gstreamer = ["dep:servo-media-gstreamer", "dep:gstreamer"]

# Allows multiprocess and ipc mode. If enabled this still needs the correct preference flags to use multi process mode.
multiprocess = ["servo-base/multiprocess", "servo-constellation/multiprocess"]

native-bluetooth = ["servo-bluetooth/native-bluetooth"]
no-wgl = ["dep:mozangle", "mozangle/egl", "mozangle/build_dlls", "surfman/sm-angle-default", "paint_api/no-wgl"]
profilemozjs = ["script/profilemozjs"]
testbinding = ["script/testbinding"]
tracing = [
    "dep:tracing",
    "paint/tracing",
    "paint_api/tracing",
    "servo-constellation/tracing",
    "fonts/tracing",
    "layout/tracing",
    "profile_traits/tracing",
    "script/tracing",
    "net/tracing",
]
vello = ["servo-constellation/vello"]

## Enable SubtleCrypto in the WebCrypto API (<https://developer.mozilla.org/en-US/docs/Web/API/Web_Crypto_API>)
## Without this feature only the core `Crypto` Object is available.
subtlecrypto = ["script/subtlecrypto", "servo-constellation-traits/subtlecrypto"]
webgl_backtrace = [
    "script/webgl_backtrace",
    "webgl/webgl_backtrace",
    "servo-canvas-traits/webgl_backtrace",
]
webgl = [
    "dep:webgl",
    "paint/webgl",
    "script/webgl",
    "script_traits/webgl",
    "servo-constellation/webgl",
    "servo-constellation-traits/webgl",
]
webgpu = [
    "dep:webgpu",
    "script/webgpu",
    "paint/webgpu",
    "servo-constellation/webgpu",
    "servo-constellation-traits/webgpu",
]
webxr = [
    "webgl",
    "gamepad",
    "dep:webxr",
    "dep:webxr-api",
    "paint/webxr",
    "webgl/webxr",
    "script/webxr",
]

[dependencies]
accesskit = {version = "0.24.0", features = ["serde"]}
bitflags = "2.11"
cookie = {package = "cookie", version = "0.18"}
crossbeam-channel = "0.5"
devtools = {package = "servo-devtools", version = "=0.8.0", path = "../servo-devtools", optional = true}
devtools_traits = {package = "servo-devtools-traits", version = "=0.8.0", path = "../servo-devtools-traits", optional = true}
dpi = "0.1"
embedder_traits = {package = "servo-embedder-traits", version = "=0.8.0", path = "../servo-embedder-traits"}
env_logger = "0.11"
euclid = {path = "../euclid"}
fonts = {package = "servo-fonts", version = "=0.8.0", path = "../servo-fonts"}
http = "1.4"
image = {version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "rayon", "webp"]}
ipc-channel = {path = "../ipc-channel"}
keyboard-types = {version = "0.8.3", features = ["serde", "webdriver"]}
layout = {package = "servo-layout", version = "=0.8.0", path = "../servo-layout"}
layout_api = {package = "servo-layout-api", version = "=0.8.0", path = "../servo-layout-api"}
log = "0.4.32"
media = {package = "servo-media-thread", version = "=0.8.0", path = "../servo-media-thread"}
mozangle = {optional = true, path = "../mozangle"}
net = {package = "servo-net", version = "=0.8.0", path = "../servo-net"}
net_traits = {package = "servo-net-traits", version = "=0.8.0", path = "../servo-net-traits"}
paint = {package = "servo-paint", version = "=0.8.0", path = "../servo-paint"}
paint_api = {package = "servo-paint-api", version = "=0.8.0", path = "../servo-paint-api"}
parking_lot = {version = "0.12", features = ["serde"]}
profile = {package = "servo-profile", version = "=0.8.0", path = "../servo-profile"}
profile_traits = {package = "servo-profile-traits", version = "=0.8.0", path = "../servo-profile-traits"}
rustc-hash = "2.1.2"
script = {package = "servo-script", version = "=0.8.0", path = "../servo-script"}
script_traits = {package = "servo-script-traits", version = "=0.8.0", path = "../servo-script-traits"}
serde = "1.0.228"
servo-background-hang-monitor = {version = "=0.8.0", path = "../servo-background-hang-monitor"}
servo-base = {version = "=0.8.0", path = "../servo-base"}
servo-bluetooth = {version = "=0.8.0", path = "../servo-bluetooth", optional = true}
servo-bluetooth-traits = {version = "=0.8.0", path = "../servo-bluetooth-traits", optional = true}
servo-canvas-traits = {version = "=0.8.0", path = "../servo-canvas-traits"}
servo-config = {version = "=0.8.0", path = "../servo-config"}
servo-constellation = {version = "=0.8.0", path = "../servo-constellation"}
servo-constellation-traits = {version = "=0.8.0", path = "../servo-constellation-traits"}
servo-geometry = {version = "=0.8.0", path = "../servo-geometry"}
servo-media = {version = "=0.8.0", path = "../servo-media"}
servo-media-dummy = {version = "=0.8.0", path = "../servo-media-dummy"}
servo-tracing = {version = "=0.8.0", path = "../servo-tracing"}
servo-url = {version = "=0.8.0", path = "../servo-url"}
servo-wakelock = {version = "=0.8.0", path = "../servo-wakelock"}
storage = {package = "servo-storage", version = "=0.8.0", path = "../servo-storage"}
storage_traits = {package = "servo-storage-traits", version = "=0.8.0", path = "../servo-storage-traits"}
stylo = {path = "../stylo"}
stylo_traits = {path = "../stylo_traits"}
surfman = {path = "../surfman"}
tokio = {version = "1", features = ["sync"]}
tracing = {version = "0.1.44", optional = true}
url = {path = "../rust-url-url"}
webgl = {package = "servo-webgl", version = "=0.8.0", path = "../servo-webgl", default-features = false, optional = true}
webgpu = {package = "servo-webgpu", version = "=0.8.0", path = "../servo-webgpu", optional = true}
webrender = {features = ["serde"], path = "../webrender"}
webrender_api = {path = "../webrender_api"}
webxr-api = {package = "servo-webxr-api", version = "=0.8.0", path = "../servo-webxr-api", optional = true}

# On most platforms we bake in the resources for simplicity. On ohos we load resources via the filesystem.
# In the future we might want to use this approach also for the other platforms.
# If the feature is turned off, a resource reader must be injected into the build via `inventory::submit!()`.
[target.'cfg(not(target_env = "ohos"))'.dependencies]
servo-default-resources = {version = "=0.8.0", path = "../servo-default-resources", optional = true}

[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
webxr = {package = "servo-webxr", version = "=0.8.0", path = "../servo-webxr", optional = true}

[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
arboard = {version = "3", features = ["wayland-data-control"], optional = true}
gstreamer = {version = "0.25", features = ["v1_18"], optional = true}
servo-media-gstreamer = {version = "=0.8.0", path = "../servo-media-gstreamer", optional = true}
webxr = {package = "servo-webxr", version = "=0.8.0", path = "../servo-webxr", optional = true, features = ["glwindow", "headless"]}

[target.'cfg(all(not(target_os = "windows"), not(target_os = "ios"), not(target_os = "android"), not(target_env = "ohos"), not(target_arch = "arm"), not(target_arch = "aarch64"), not(target_arch="riscv32"), not(target_arch="riscv64")))'.dependencies]
gaol = {path = "../gaol"}

[target.'cfg(target_os = "windows")'.dependencies]
webxr = {package = "servo-webxr", version = "=0.8.0", path = "../servo-webxr", optional = true, features = ["glwindow", "headless", "openxr-api"]}

[target.'cfg(target_env = "ohos")'.dependencies]
servo-media-ohos = {version = "=0.8.0", path = "../servo-media-ohos"}
ohos-pasteboard = {version = "0.1.0", optional = true}

[dev-dependencies]
accesskit_consumer = "0.35.0"
content-security-policy = {version = "0.9", features = ["serde"]}
gleam = {path = "../gleam"}
glow = "0.17.0"
http = "1.4"
http-body-util = "0.1"
hyper = "1.10"
itertools = "0.15"
net = {package = "servo-net", version = "=0.8.0", path = "../servo-net", features = ["test-util"]}
rustls = {version = "0.23", default-features = false, features = ["logging", "std", "tls12"]}
# This must always be a path dependency, we don't want to add a dependency on a
# crates.io version of ourselves - we want to enable a feature of ourselves.
servo = {path = ".", features = ["testbinding", "tracing"]}
tracing = "0.1.44"
winit = "0.30.13"

[[test]]
name = "multiprocess"
harness = false

[lints.clippy]
manual_string_new = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)', 'cfg(coverage)', 'cfg(llvm_pgo)', 'cfg(ohos_mock)'] }

# RSA key generation could be very slow without compilation
# optimizations, in development mode. Without optimizations, WPT might
# consider RSA key generation tests fail due to timeout.
# Building with higher optimization levels can speed up the key
# generation process to avoid false negative result in those tests.
# More details: <https://docs.rs/rsa/0.10.0-rc.18/rsa/index.html>
