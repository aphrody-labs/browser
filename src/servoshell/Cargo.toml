[package]
name = "servoshell"
build = "build.rs"
publish = false
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
rust-version = "1.88.0"

[lib]
name = "servoshell"
path = "lib.rs"
bench = false

[[bin]]
name = "servoshell"
path = "main.rs"
bench = false

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
FileDescription = "ServoShell"
LegalCopyright = "© The Servo Project Developers"
OriginalFilename = "servoshell.exe"
ProductName = "ServoShell"

[features]
# Don't add new features to `default` directly. Add to `default_base` instead.
default = ["default_base", "media-gstreamer"]
# Feature groups:
# Base default features, without GStreamer media support.
default_base = [
    "bundled",
    "default_web_features",
    "default_tooling",
    "jemalloc",
    "max_log_level",
    "multiprocess",
    "js_jit",
]
# Enable jemalloc on platforms that support it (not OHOS and not Windows).
jemalloc = ["servo-allocator/use-jemalloc"]
# Default web features should be kept in sync with the list in servo/Cargo.toml.
# We also need to enable our own features, since we also have `cfg` gated code here.
default_web_features = ["servo/default_web_features", "gamepad", "webgpu", "webgl", "webxr"]
default_tooling = ["servo/default_tooling", "devtools"]
# Bundle required resources in the binary.
bundled = ["servo/bundled"]

## Individual features below this line
baked-in-resources = ["servo/baked-in-resources"]
bundled_freetype = ["servo/bundled_freetype"]
crown = ["servo/crown"]
debugmozjs = ["servo/debugmozjs"]
devtools = ["servo/devtools"]
gamepad = ["servo/gamepad"]
jitspew = ["servo/jitspew"]
js_backtrace = ["servo/js_backtrace"]
js_jit = ["servo/js_jit"]
max_log_level = ["log/release_max_level_info"]
media-gstreamer = ["servo/media-gstreamer"]
multiprocess = ["servo/multiprocess"]
native-bluetooth = ["servo/native-bluetooth"]
profilemozjs = ["servo/profilemozjs"]
subtlecrypto = ["servo/subtlecrypto"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "servo/tracing"]
tracing-hitrace = ["tracing", "dep:hitrace"]
tracing-perfetto = ["tracing", "dep:tracing-perfetto"]
vello = ["servo/vello"]
webgl_backtrace = ["servo/webgl_backtrace"]
webgl = ["servo/webgl"]
webgpu = ["servo/webgpu"]
webxr = ["servo/webxr"]

[dependencies]
accesskit = {version = "0.24.0", features = ["serde"]}
bpaf = {version = "0.9.26", features = ["derive"]}
cfg-if = "1.0.4"
crossbeam-channel = "0.5"
dpi = "0.1"
euclid = {path = "../euclid"}
flate2 = "1.1"
hitrace = {version = "0.2.0", features = ["api-19", "tracing-rs"], optional = true}
image = {version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "rayon", "webp"]}
keyboard-types = {version = "0.8.3", features = ["serde", "webdriver"]}
libc = "0.2"
log = "0.4.32"
mime_guess = "2.0.5"
raw-window-handle = "0.6"
rustls = {version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws-lc-rs"]}
servo = {version = "=0.8.0", path = "../servo", default-features = false, features = ["background_hang_monitor", "bluetooth", "testbinding"]}
tokio = "1"
tracing = {version = "0.1.44", optional = true}
tracing-perfetto = {version = "0.1.5", optional = true}
tracing-subscriber = {version = "0.3.23", optional = true, features = ["env-filter"]}
url = {path = "../rust-url-url"}
webdriver_server = {package = "servo-webdriver-server", version = "=0.8.0", path = "../servo-webdriver-server"}

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.22"
# https://github.com/servo/servo/issues/32175
# By default Android enforce the tagged pointers feature, which does not work well with mozjs.
# Like Gecko, replace the system allocator with jemalloc.
servo-allocator = {version = "=0.8.0", path = "../servo-allocator", features = ["use-jemalloc"]}

[target.'cfg(not(target_os = "android"))'.dependencies]
backtrace = "0.3"

[target.'cfg(target_env = "ohos")'.dependencies]
env_filter = "0.1.4"
euclid = {path = "../euclid"}
hilog = "0.2.2"
# force inprocess until we add multi-process support for ohos
ipc-channel = {features = ["force-inprocess"], path = "../ipc-channel"}
napi-derive-ohos = "1.2.0"
napi-ohos = "1.2.0"
ohos-abilitykit-sys = {version = "0.1.6", features = ["api-14"]}
ohos-deviceinfo = "0.1.0"
ohos-ime = "0.4.2"
ohos-ime-sys = "0.2.4"
ohos-vsync = "0.1.3"
ohos-window-sys = "0.1.7"
ohos-sys-opaque-types = "0.1.7"
ohos-window-manager-sys = {version = "0.1", features = ["api-14"]}
memmap2 = "0.9.10"
xcomponent-sys = {version = "0.4.0", features = ["api-20", "keyboard-types"]}

[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
nix = {version = "0.30", features = ["fs"]}
serde_json = "1.0"
servo-base = {version = "=0.8.0", path = "../servo-base"}
surfman = {features = ["sm-angle-builtin"], path = "../surfman"}

[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
dirs = "7.0"
egui = "0.34.3"
egui-winit = {version = "0.34.3", default-features = false, features = ["accesskit", "clipboard", "wayland"]}
egui_glow = {version = "0.34.3", features = ["winit"]}
gilrs = "0.11.1"
glow = "0.17.0"
headers = "0.4"
itertools = "0.15"
rfd = "0.18.0"
serde_json = "1.0"
# For optional feature servo-allocator/use-jemalloc and servo-allocator/allocation-tracking
servo-allocator = {version = "=0.8.0", path = "../servo-allocator"}
surfman = {features = ["sm-x11"], path = "../surfman"}
winit = "0.30.13"

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "macos"))'.dependencies]
signal-hook-registry = "1.4.8"

[target.'cfg(target_os = "windows")'.dependencies]
servo = {version = "=0.8.0", path = "../servo", default-features = false, features = ["no-wgl"]}
windows-sys = {version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_Console"]}

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"
objc2-app-kit = {version = "0.3.2", default-features = false, features = ["std", "NSColorSpace", "NSResponder", "NSView", "NSWindow"]}
objc2-foundation = {version = "0.3.1", default-features = false, features = ["std"]}

[lints.clippy]
manual_string_new = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)', 'cfg(coverage)', 'cfg(llvm_pgo)', 'cfg(ohos_mock)'] }

# RSA key generation could be very slow without compilation
# optimizations, in development mode. Without optimizations, WPT might
# consider RSA key generation tests fail due to timeout.
# Building with higher optimization levels can speed up the key
# generation process to avoid false negative result in those tests.
# More details: <https://docs.rs/rsa/0.10.0-rc.18/rsa/index.html>
