serde_json = "1.0"
selectors = {path = "../selectors"}
servo_arc = {path = "../servo_arc"}
stylo_atoms = {path = "../stylo_atoms"}
stylo = {path = "../stylo"}
stylo_traits = {path = "../stylo_traits"}
url = {path = "../rust-url-url"}
