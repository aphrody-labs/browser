version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
rust-version = "1.88.0"

[lib]
name = "style_tests"
path = "lib.rs"
doctest = false

[dependencies]
app_units = {path = "../app_units"}
cssparser = {features = ["serde"], path = "../cssparser"}
