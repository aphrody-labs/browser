[package]
name = "stylo_dom"
authors = ["The Servo Project Developers"]
documentation = "https://docs.rs/stylo_dom/"
description = "DOM state types for Stylo"
repository = "https://github.com/servo/stylo"
keywords = ["css", "style"]
license = "MPL-2.0"
edition = "2021"
version = "0.24.0"

[lib]
path = "lib.rs"

[dependencies]
bitflags = "2"
malloc_size_of = {version = "0.24.0", path = "../stylo_malloc_size_of", package = "stylo_malloc_size_of", features = ["servo"]}
