[package]
name = "stylo_traits"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/stylo"
edition = "2024"
description = "Types used by the Stylo CSS engine"
version = "0.24.0"

[lib]
name = "style_traits"
path = "lib.rs"

[features]
default = ["servo"]
servo = ["stylo_atoms", "cssparser/serde", "url", "euclid/serde"]
gecko = []

[dependencies]
app_units = {path = "../app_units"}
bitflags = "2"
cssparser = {path = "../cssparser"}
euclid = {path = "../euclid"}
malloc_size_of = {version = "0.24.0", path = "../stylo_malloc_size_of", package = "stylo_malloc_size_of", features = ["servo"]}
malloc_size_of_derive = "0.1"
selectors = {version = "0.43.0", path = "../selectors"}
serde = "1.0"
servo_arc = {version = "0.6.0", path = "../servo_arc"}
stylo_atoms = {version = "0.24.0", path = "../stylo_atoms", optional = true}
thin-vec = "0.2"
to_shmem = {version = "0.8.0", path = "../to_shmem", features = ["servo"]}
to_shmem_derive = {version = "0.3.0", path = "../to_shmem_derive"}
url = {optional = true, path = "../rust-url-url"}
