[package]
name = "markup5ever_rcdom"
description = "Basic, unsupported DOM structure for use by tests in html5ever/xml5ever"
readme = "README.md"
documentation = "https://docs.rs/markup5ever_rcdom"
categories = [ "parser-implementations", "web-programming" ]
publish = false
version = "0.40.1"
edition = "2021"
authors = ["The html5ever Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/html5ever"
rust-version = "1.85"

[lib]
path = "lib.rs"

[dependencies]
html5ever = {version = "0.40", path = "../html5ever"}
markup5ever = {version = "0.40", path = "../markup5ever", features = ["serde"]}
tendril = {version = "0.5", path = "../tendril"}
xml5ever = {version = "0.40", path = "../xml5ever"}

[dev-dependencies]
criterion = "0.8.2"
env_logger = "0.11"
libtest-mimic = "0.8.1"
serde_json = "1.0"

[[bench]]
name = "deserialize-serialize"
harness = false

[[test]]
name = "html-tokenizer"
harness = false

[[test]]
name = "html-tree-builder"
harness = false

[[test]]
name = "xml-tree-builder"
harness = false

[[test]]
name = "xml-tokenizer"
harness = false
