[package]
name = "servo-net"
autotests = false # Inhibit lookup for tests/*.rs without [[test]] sections
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/servo"
description = "A component of the servo web-engine."
rust-version = "1.88.0"
publish = true

[lib]
name = "net"
path = "lib.rs"
test = false
doctest = false

[features]
devtools = ["dep:devtools_traits"]
test-util = ["hyper-util/server-graceful", "dep:servo-default-resources", "net_traits/test-util"]
tracing = ["dep:tracing"]

[dependencies]
aws-lc-rs = {version = "1.17", default-features = false, features = ["aws-lc-sys"]}
async-compression = {version = "0.4.12", default-features = false, features = ["brotli", "gzip", "tokio", "zlib", "zstd"]}
async-recursion = "1.1"
async-tungstenite = {version = "0.35", features = ["tokio-rustls-webpki-roots"]}
base64 = "0.23.0"
bytes = {version = "1.0", features = ["serde"]}
chrono = {version = "0.4", features = ["serde"]}
content-security-policy = {version = "0.9", features = ["serde"]}
cookie = {package = "cookie", version = "0.18"}
crossbeam-channel = "0.5"
data-url = {path = "../../rust-url/data-url"}
devtools_traits = {package = "servo-devtools-traits", version = "=0.8.0", path = "../servo-devtools-traits", optional = true}
embedder_traits = {package = "servo-embedder-traits", version = "=0.8.0", path = "../servo-embedder-traits"}
fst = "0.4"
fonts = {package = "servo-fonts", version = "=0.8.0", path = "../servo-fonts"}
futures = {version = "0.3", default-features = false}
futures-core = {version = "0.3", default-features = false}
futures-util = {version = "0.3", default-features = false}
headers = "0.4"
http = "1.4"
http-body-util = "0.1"
hyper = {version = "1.10", features = ["client", "http1", "http2"]}
hyper-rustls = {version = "0.27", default-features = false, features = ["http1", "http2", "logging", "tls12", "webpki-tokio"]}
hyper-util = {version = "0.1", features = ["client-legacy", "client-proxy", "http2", "tokio"]}
hyper_serde = {package = "servo-hyper-serde", version = "=0.8.0", path = "../servo-hyper-serde"}
imsz = "0.4"
ipc-channel = {path = "../../ipc-channel/ipc-channel"}
itertools = "0.15"
log = "0.4.32"
malloc_size_of = {package = "servo-malloc-size-of", version = "=0.8.0", path = "../servo-malloc-size-of"}
malloc_size_of_derive = "0.1"
mime = "0.3.13"
mime_guess = "2.0.5"
net_traits = {package = "servo-net-traits", version = "=0.8.0", path = "../servo-net-traits"}
nom = "8.0.0"
paint_api = {package = "servo-paint-api", version = "=0.8.0", path = "../servo-paint-api"}
parking_lot = {version = "0.12", features = ["serde"]}
pixels = {package = "servo-pixels", version = "=0.8.0", path = "../servo-pixels"}
profile_traits = {package = "servo-profile-traits", version = "=0.8.0", path = "../servo-profile-traits"}
postcard = {version = "1.1.3", default-features = false, features = ["use-std"]}
quick_cache = {version = "0.7.0", default-features = false, features = ["custom-hasher"]}
rand = "0.10"
regex = "1.12"
resvg = "0.50.0"
rustc-hash = "2.1.2"
rustls = {version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws-lc-rs"]}
rustls-pki-types = "1.14"
rustls-platform-verifier = "0.7.0"
rusqlite = {version = "0.38", features = ["bundled"]}
serde = "1.0.228"
servo-base = {version = "=0.8.0", path = "../servo-base"}
servo-config = {version = "=0.8.0", path = "../servo-config"}
servo-default-resources = {version = "=0.8.0", path = "../servo-default-resources", optional = true}
servo-tracing = {version = "=0.8.0", path = "../servo-tracing"}
servo-url = {version = "=0.8.0", path = "../servo-url"}
servo_arc = {path = "../../stylo/servo_arc"}
sea-query = {version = "1.0.1", default-features = false, features = ["backend-sqlite", "derive"]}
sea-query-rusqlite = "0.8.0"
smallvec = {version = "1.15", features = ["serde", "union"]}
tempfile = "3"
time = {package = "time", version = "0.3", features = ["large-dates", "local-offset", "serde"]}
tokio = {version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"]}
tokio-rustls = {version = "0.26", default-features = false, features = ["logging"]}
tokio-stream = "0.1"
tokio-util = {version = "0.7.18", default-features = false, features = ["codec", "io"]}
tower = {version = "0.5", default-features = false, features = ["util"]}
tracing = {version = "0.1.44", optional = true}
tungstenite = "0.30"
url = {path = "../../rust-url/rust-url-url"}
uuid = {version = "1.23.3", features = ["v4", "v5"]}
walkdir = "2.5"
webpki-roots = "1.0"
webrender_api = {path = "../../webrender/webrender_api"}

[dev-dependencies]
flate2 = "1.1"
fst = "0.4"
hyper = {version = "1.10", features = ["full"]}
hyper-util = {version = "0.1", features = ["client-legacy", "client-proxy", "http2", "tokio", "server-graceful"]}
# This must always be a path dependency, we don't want to add a dependency on a
# crates.io version of ourselves - we want to enable a feature of ourselves.
net = {package = "servo-net", path = ".", features = ["devtools", "test-util"]}
rustls = {version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws-lc-rs"]}
servo-default-resources = {version = "=0.8.0", path = "../servo-default-resources"}

[[test]]
name = "main"
path = "tests/main.rs"

[lints.clippy]
manual_string_new = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(crown)', 'cfg(coverage)', 'cfg(llvm_pgo)', 'cfg(ohos_mock)'] }

# RSA key generation could be very slow without compilation
# optimizations, in development mode. Without optimizations, WPT might
# consider RSA key generation tests fail due to timeout.
# Building with higher optimization levels can speed up the key
# generation process to avoid false negative result in those tests.
# More details: <https://docs.rs/rsa/0.10.0-rc.18/rsa/index.html>
