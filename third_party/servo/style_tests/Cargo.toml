[package]
name = "style_tests"
publish = false
version = "0.8.0"
edition = "2024"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
rust-version = "1.88.0"

[lib]
name = "style_tests"
path = "lib.rs"
doctest = false

[dependencies]
app_units = {path = "../../app_units/app_units"}
cssparser = {features = ["serde"], path = "../../rust-cssparser/cssparser"}
euclid = {path = "../../euclid/euclid"}
html5ever = {path = "../../html5ever/html5ever"}
rayon = "1"
serde_json = "1.0"
selectors = {path = "../../stylo/selectors"}
servo_arc = {path = "../../stylo/servo_arc"}
stylo_atoms = {path = "../../stylo/stylo_atoms"}
stylo = {path = "../../stylo/stylo"}
stylo_traits = {path = "../../stylo/stylo_traits"}
url = {path = "../../rust-url/rust-url-url"}
