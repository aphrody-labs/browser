[package]
name = "stylo_malloc_size_of"
authors = ["The Servo Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/stylo"
description = "An allocator-agnostic crate for measuring the heap size of a value"
edition = "2024"
version = "0.24.0"

[lib]
path = "lib.rs"

[features]
gecko = ["thin-vec/gecko-ffi"]
servo = ["string_cache"]

[dependencies]
app_units = {path = "../../app_units/app_units"}
cssparser = {path = "../../rust-cssparser/cssparser"}
euclid = {path = "../../euclid/euclid"}
hashbrown = "0.17.0"
parking_lot = "0.12"
selectors = {version = "0.43.0", path = "../selectors"}
servo_arc = {version = "0.6.0", path = "../servo_arc"}
smallbitvec = {path = "../../smallbitvec/smallbitvec"}
smallvec = "1.13"
string_cache = {optional = true, path = "../../string-cache/string_cache"}
thin-vec = "0.2.13"
void = "1.0.2"
